
name: NEBULA Windows Build

on:
  push:
    branches:
      - main
      - "feature/**"
      - "ai/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nebula-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python -c "import json,pathlib; json.loads(pathlib.Path('AUTOPILOT_CONFIG.yml').read_text(encoding='utf-8-sig')); print('CONFIG OK')"
          if ($LASTEXITCODE -ne 0) { throw "Invalid AUTOPILOT_CONFIG.yml" }

          python -c "import json,pathlib; json.loads(pathlib.Path('AUTOPILOT_GOALS.yml').read_text(encoding='utf-8-sig')); print('GOALS OK')"
          if ($LASTEXITCODE -ne 0) { throw "Invalid AUTOPILOT_GOALS.yml" }

      - name: Validate Python
        shell: pwsh
        run: |
          python -m compileall -q scripts
          if ($LASTEXITCODE -ne 0) {
            throw "Python validation failed"
          }

      - name: Check project files
        shell: pwsh
        run: |
          $files = @(
            "CMakeLists.txt",
            "Source/PluginProcessor.cpp",
            "Source/PluginProcessor.h",
            "Source/PluginEditor.cpp",
            "Source/PluginEditor.h",
            "Tests/DSPTests.cpp"
          )

          foreach ($file in $files) {
            if (!(Test-Path $file)) {
              throw "Missing file: $file"
            }
          }

  build:
    name: Build NEBULA FX
    runs-on: windows-latest
    needs: validate
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Check build tools
        shell: pwsh
        run: |
          cmake --version
          if ($LASTEXITCODE -ne 0) { throw "CMake missing" }

          where.exe cl
          if ($LASTEXITCODE -ne 0) { throw "MSVC missing" }

      - name: Configure project
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DBUILD_TESTING=ON

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed"
          }

      - name: Compile VST3 and Standalone
        shell: pwsh
        run: |
          cmake --build build `
            --config Release `
            --parallel 2

          if ($LASTEXITCODE -ne 0) {
            throw "Compilation failed"
          }

      - name: Run tests
        shell: pwsh
        run: |
          ctest --test-dir build `
            -C Release `
            --output-on-failure

          if ($LASTEXITCODE -ne 0) {
            throw "Tests failed"
          }

      - name: Collect VST3 and Standalone
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vst3 = Get-ChildItem build -Recurse -Directory -Filter "*.vst3"
          $app = Get-ChildItem build -Recurse -File -Filter "NEBULA FX.exe"

          if (!$vst3) { throw "VST3 was not generated" }
          if (!$app) { throw "Standalone was not generated" }

          New-Item -ItemType Directory -Force package/VST3 | Out-Null
          New-Item -ItemType Directory -Force package/Standalone | Out-Null

          foreach ($item in $vst3) {
            Copy-Item $item.FullName package/VST3 -Recurse -Force
          }

          foreach ($item in $app) {
            Copy-Item $item.FullName package/Standalone -Force
          }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: NEBULA-Windows-x64-Release
          path: package/
          if-no-files-found: error
          retention-days: 14
