name: NEBULA Cross-Platform Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nebula-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: NEBULA-Windows
          - os: macos-26
            artifact: NEBULA-macOS

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout NEBULA
        uses: actions/checkout@v4

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Clone JUCE 8.0.6
        shell: bash
        run: |
          git clone --depth 1 --branch 8.0.6 \
            https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build `
            -A x64 `
            -DBUILD_TESTING=ON

      - name: Configure macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake -S . -B build \
            -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DBUILD_TESTING=ON

      - name: Build all targets on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --build build `
            --config Release `
            --parallel 2

      - name: Build all targets on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake --build build \
            --config Release \
            --parallel 2

      - name: Run tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ctest --test-dir build `
            -C Release `
            --output-on-failure

      - name: Run tests on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ctest --test-dir build \
            -C Release \
            --output-on-failure

      - name: Upload Windows VST3 and Standalone
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/**/VST3/*.vst3/**
            build/**/Standalone/**
          if-no-files-found: error
          compression-level: 6

      - name: Upload macOS VST3 and Standalone
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/**/VST3/*.vst3/**
            build/**/Standalone/**
          if-no-files-found: error
          compression-level: 6